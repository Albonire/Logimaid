<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Stage 1: Lexer/Parser -->
  <rect x="50" y="50" width="120" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="110" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1e293b">Lexer/Parser</text>
  <text x="110" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">HDL to AST</text>

  <!-- Arrow 1 -->
  <path d="M 170 80 L 210 80" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Stage 2: Logical DAG -->
  <rect x="210" y="50" width="140" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="280" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1e293b">Circuit Logic</text>
  <text x="280" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">DAG and Sorting</text>

  <!-- Arrow 2 -->
  <path d="M 350 80 L 390 80" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Stage 3: Layout Engine -->
  <rect x="390" y="50" width="160" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="470" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1e293b">Layout Engine</text>
  <text x="470" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">Sugiyama Framework</text>

  <!-- Arrow 3 -->
  <path d="M 550 80 L 590 80" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Stage 4: SVG Render -->
  <rect x="590" y="50" width="140" height="60" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
  <text x="660" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#f8fafc">SVG Render</text>
</svg>
